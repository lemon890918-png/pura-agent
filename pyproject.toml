[project]
name = "pure-agent"
version = "0.1.0"
description = "Pure self-built agent runtime with Goal/Plan long-running support"
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "wenxin"}]

dependencies = [
    "pydantic>=2.5",
    "typer>=0.12",
    "structlog>=24.1,<26",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.43",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
pure-agent = "pure_agent.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pure_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "smoke: 快速冒烟测试",
    "slow: 慢测试（真实 LLM 调用）",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "RUF"]
ignore = ["E501"]
